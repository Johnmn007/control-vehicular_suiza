services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sicisv-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: sicisv
      POSTGRES_USER: sicisv
      POSTGRES_PASSWORD: sicisv_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicisv -d sicisv"]
      interval: 5s
      timeout: 5s
      retries: 5

  facial-service:
    build:
      context: ./backend/facial-service
      dockerfile: Dockerfile
    container_name: sicisv-facial
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://sicisv:sicisv_dev@sicisv-postgres:5432/sicisv
      HOST: "0.0.0.0"
      PORT: "3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sicisv-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://sicisv:sicisv_dev@sicisv-postgres:5432/sicisv
      FACIAL_SERVICE_URL: http://sicisv-facial:3002
      JWT_SECRET: sicisv_jwt_secret_2026_change_in_production
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sicisv-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/components.json:/app/components.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json

volumes:
  postgres_data:
